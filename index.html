<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esusu Pay · Paycheck Fit (concept demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="tb-left">
    <img src="assets/esusu-logo.svg" alt="Esusu" class="tb-logo">
    <span class="tb-div"></span>
    <span class="tb-title">Esusu Pay</span>
    <span class="tb-sub">Paycheck Fit</span>
    <span class="tb-pill">Concept</span>
  </div>
  <div class="tb-right">
    <span class="tb-label">Renter</span>
    <div class="persona-row" id="personas"></div>
  </div>
</header>

<main class="stage">
  <section class="phone-col">
    <div class="phone-cap"><span class="cap-n">1</span>Home</div>
    <div class="phone"><div class="island"></div><div class="screen" id="screen-home"></div></div>
  </section>
  <section class="phone-col">
    <div class="phone-cap"><span class="cap-n">2</span>Split Pay plan</div>
    <div class="phone"><div class="island"></div><div class="screen" id="screen-plan"></div></div>
  </section>
  <section class="phone-col">
    <div class="phone-cap"><span class="cap-n">3</span>Pick your dates</div>
    <div class="phone"><div class="island"></div><div class="screen" id="screen-dates"></div></div>
  </section>
</main>

<section class="team" id="team"></section>

<footer class="foot">Unofficial concept demo by Mohith Gajjela. Not affiliated with Esusu. Synthetic data.</footer>
<script type="module" src="app.js"></script>
</body>
</html>
